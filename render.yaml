services:
  - type: web
    name: equity-research-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      # Optional hardening — set these to lock down the public API.
      # API_SECRET must also be set as NEXT_PUBLIC_API_SECRET on the frontend.
      - key: API_SECRET
        sync: false
      - key: FORCE_PASSWORD
        sync: false
